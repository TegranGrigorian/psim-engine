[project]
name = "psim-engine"
version = "0.1.0"
description = "Routes psim-tools trips with r5py and writes trip_results.parquet"
requires-python = ">=3.12"
dependencies = [
    "r5py>=1.1.7",
    "pandas",
    "pyarrow",
    "geopandas",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
psim-engine = "psim_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psim_engine"]
